name: Frontend validation

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "package.json"
      - ".htmlvalidate.json"
      - ".stylelintrc.json"
      - "eslint.config.js"
      - ".github/workflows/frontend-validation.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "package.json"
      - ".htmlvalidate.json"
      - ".stylelintrc.json"
      - "eslint.config.js"
      - ".github/workflows/frontend-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate HTML, CSS and JavaScript
        run: npm run validate
