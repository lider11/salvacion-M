name: Frontend validation

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "package.json"
      - "package-lock.json"
      - ".pa11yci.json"
      - "playwright.config.js"
      - "tests/**"
      - "sites/salvacion-m/**"
      - "sites/salvacion-m-gates-qa/**"
      - "sites/salvacion-m-crm-qa/**"
      - ".htmlvalidate.json"
      - ".stylelintrc.json"
      - "eslint.config.js"
      - ".github/workflows/frontend-validation.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "package.json"
      - "package-lock.json"
      - ".pa11yci.json"
      - "playwright.config.js"
      - "tests/**"
      - "sites/salvacion-m/**"
      - "sites/salvacion-m-gates-qa/**"
      - "sites/salvacion-m-crm-qa/**"
      - ".htmlvalidate.json"
      - ".stylelintrc.json"
      - "eslint.config.js"
      - ".github/workflows/frontend-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate HTML, CSS, JavaScript and WCAG
        run: npm run validate

      - name: Start local frontend server
        run: |
          npm run serve > /tmp/salvacion-http.log 2>&1 &
          echo $! > /tmp/salvacion-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/salvacion-http.log
          exit 1

      - name: Run Pa11y WCAG audit
        run: npm run test:a11y:pa11y

      - name: Run axe WCAG 2.2 audit
        run: npm run test:a11y:axe

      - name: Build Salvacion M worker
        run: cd sites/salvacion-m && npm run build

      - name: Run Salvacion M worker tests including D1, G2, G3 and G4
        run: cd sites/salvacion-m && npm test

      - name: Build and test Gates QA
        run: |
          cd sites/salvacion-m-gates-qa
          npm run build
          npm run validate
          npm test

      - name: Build and test CRM QA Auth v2
        run: |
          cd sites/salvacion-m-crm-qa
          npm run build
          npm run validate
          npm test

      - name: Preserve G4 QA summary
        if: always()
        run: |
          mkdir -p qa-results
          cat > qa-results/g4-summary.md <<'EOF'
          # G4 automated QA

          The workflow result is the reproducible gate record for:

          - static validation;
          - WCAG 2.2 AA automated audits with Pa11y and axe;
          - public-site E2E behavior;
          - Worker, D1, CRM and agenda regression;
          - ASVS-inspired API security contracts.
          EOF

      - name: Upload G4 QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g4-qa-evidence
          path: qa-results/g4-summary.md
          retention-days: 30
