name: Frontend validation

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "package.json"
      - ".pa11yci.json"
      - "playwright.config.js"
      - "tests/**"
      - "sites/salvacion-m/**"
      - ".htmlvalidate.json"
      - ".stylelintrc.json"
      - "eslint.config.js"
      - ".github/workflows/frontend-validation.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "package.json"
      - ".pa11yci.json"
      - "playwright.config.js"
      - "tests/**"
      - "sites/salvacion-m/**"
      - ".htmlvalidate.json"
      - ".stylelintrc.json"
      - "eslint.config.js"
      - ".github/workflows/frontend-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate HTML, CSS, JavaScript and WCAG
        run: npm run validate

      - name: Start local frontend server
        run: |
          npm run serve > /tmp/salvacion-http.log 2>&1 &
          echo $! > /tmp/salvacion-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/salvacion-http.log
          exit 1

      - name: Run Pa11y WCAG audit
        run: npm run test:a11y:pa11y

      - name: Run axe WCAG 2.2 audit
        run: npm run test:a11y:axe

      - name: Build Salvacion M worker
        run: cd sites/salvacion-m && npm run build

      - name: Run Salvacion M worker tests including D1 and G2
        run: cd sites/salvacion-m && npm test
