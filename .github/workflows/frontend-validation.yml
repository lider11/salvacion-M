name: Frontend validation

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "package.json"
      - ".pa11yci.json"
      - "playwright.config.js"
      - "tests/**"\n      - "sites/salvacion-m/**"\n      - "sites/salvacion-m/**"
      - ".htmlvalidate.json"
      - ".stylelintrc.json"
      - "eslint.config.js"
      - ".github/workflows/frontend-validation.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "package.json"
      - ".pa11yci.json"
      - "playwright.config.js"
      - "tests/**"
      - ".htmlvalidate.json"
      - ".stylelintrc.json"
      - "eslint.config.js"
      - ".github/workflows/frontend-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate HTML, CSS, JavaScript and WCAG
        run: npm run validate

      - name: Run axe WCAG 2.2 audit
        run: npm run test:a11y:axe
