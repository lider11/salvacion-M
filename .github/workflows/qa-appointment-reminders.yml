name: QA appointment reminders

on:
  schedule:
    # Runs hourly at minute 0. UTC is equivalent to hourly America/Bogota.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salvacion-m-qa-reminders
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch QA reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: qa

    steps:
      - name: Invoke protected QA dispatcher
        id: dispatch
        env:
          DISPATCH_URL: https://salvacion-m-gates-qa.devergel1980.chatgpt.site/api/internal/reminders/dispatch
          REMINDER_TRIGGER_TOKEN: ${{ secrets.REMINDER_TRIGGER_TOKEN }}
        run: |
          test -n "$REMINDER_TRIGGER_TOKEN"
          status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $REMINDER_TRIGGER_TOKEN" \
            --header "Accept: application/json" \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-all-errors \
            "$DISPATCH_URL")"
          test "$status" -ge 200
          test "$status" -lt 300
          echo "http_status=$status" >> "$GITHUB_OUTPUT"

      - name: Preserve safe execution evidence
        if: always()
        env:
          HTTP_STATUS: ${{ steps.dispatch.outputs.http_status }}
        run: |
          {
            echo "## QA reminder dispatch"
            echo
            echo "- UTC timestamp: `$(date -u +%Y-%m-%dT%H:%M:%SZ)`"
            echo "- HTTP status: `${HTTP_STATUS:-not-observed}`"
            echo "- Workflow run: `${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}`"
            echo "- Trigger: `${GITHUB_EVENT_NAME}`"
          } >> "$GITHUB_STEP_SUMMARY"
