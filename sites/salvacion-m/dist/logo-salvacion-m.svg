<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 96" role="img" aria-labelledby="title desc">
  <title id="title">Salvación M</title>
  <desc id="desc">Dos figuras humanas curvas forman una M de acompañamiento y protección.</desc>
  <style>
    .person-left{animation:meet-left .72s cubic-bezier(.2,.75,.25,1) both}
    .person-right{animation:meet-right .72s cubic-bezier(.2,.75,.25,1) both}
    .embrace-line{animation:reveal .34s .52s ease-out both}
    .wordmark{animation:reveal .42s .66s ease-out both}
    @keyframes meet-left{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
    @keyframes meet-right{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
    @keyframes reveal{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.person-left,.person-right,.embrace-line,.wordmark{animation:none}}
  </style>
  <g aria-hidden="true">
    <g class="person-left"><circle cx="29" cy="17" r="10" fill="#0B3A53"/><path d="M14 82V36c0-10 10-16 18-9l32 30v16c-2 2-4 2-5 0L30 46v7c0 13-6 23-16 29Z" fill="#0B3A53"/></g>
    <g class="person-right"><circle cx="99" cy="17" r="10" fill="#008C8C"/><path d="M114 82V36c0-10-10-16-18-9L64 57v16c2 2 4 2 5 0l29-27v7c0 13 6 23 16 29Z" fill="#1F8A5B"/></g>
    <path class="embrace-line" d="M26 36c9 3 17 10 24 17 5 5 10 9 14 9s9-4 14-9c7-7 15-14 24-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="wordmark"><text x="134" y="50" fill="#0B3A53" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" letter-spacing="2">SALVACIÓN <tspan fill="#1F8A5B">M</tspan></text><text x="135" y="72" fill="#53666F" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" letter-spacing=".35">ORIENTACIÓN Y ACOMPAÑAMIENTO EN SALUD</text></g>
</svg>
