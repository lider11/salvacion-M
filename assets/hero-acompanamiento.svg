  <path d="M165 221l31 35 48-10" fill="none" stroke="#c88c67" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Persona a la derecha -->
  <rect x="386" y="255" width="92" height="104" rx="20" fill="#b8cbd5"/>
  <path d="M404 326l-29 80m63-80 10 80" stroke="#102a43" stroke-width="22" stroke-linecap="round"/>
  <path d="M374 281v-52c0-34 19-51 44-51s46 17 46 51v52" fill="#b48424"/>
